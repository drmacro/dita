<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Topic with flagging</title>
    <link rel="stylesheet" href="./flagged-content.css">
  </head>
  <body>
    <h1>Topic with flagging</h1>
    <div>
      <p>This is unflagged content.</p>
      <p class="flag-novice">Novice content</p>
      <p class="flag-adept">Adept content.</p>
      <details class="flag-expert">
        <summary>Expand for expert content</summary>
        <p class="flag-expert">Expert content.</p>
      </details>
    </div>
  </body>
</html>
